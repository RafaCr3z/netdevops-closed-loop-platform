<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#da3633" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9e6a03" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="actionBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#093c85" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="actionRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8e1515" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#104e1e" stop-opacity="0.85"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="700">Deterministic Closed-Loop Decision Tree</text>
  <text x="480" y="58" text-anchor="middle" fill="#8b949e" font-size="12">Autonomous 4-Root-Cause Differential Diagnostic &amp; Remediation Engine</text>

  <!-- 1. Start Alert (Pill) -->
  <g transform="translate(360, 80)" filter="url(#shadow)">
    <rect width="240" height="46" rx="23" fill="url(#alertGrad)" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🚨 PRTG Alert: VPN Inactive</text>
  </g>

  <!-- Line Start -> Diamond 1 -->
  <line x1="480" y1="126" x2="480" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. Decision 1: Verify MPLS Underlay -->
  <g transform="translate(480, 205)" filter="url(#shadow)">
    <polygon points="0,-42 75,0 0,42 -75,0" fill="url(#decisionGrad)" stroke="#f2cc60" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Check MPLS</text>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Underlay Circuit</text>
  </g>

  <!-- Branch 1: MPLS Down (Left) -->
  <path d="M 405 205 L 140 205 L 140 600" fill="none" stroke="#ff7b72" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="220" y="190" width="90" height="22" rx="4" fill="#161b22" stroke="#da3633" stroke-width="1"/>
  <text x="265" y="205" text-anchor="middle" fill="#ff7b72" font-size="10" font-weight="700">MPLS Down</text>

  <!-- Branch 1: MPLS OK (Down to Diamond 2) -->
  <line x1="480" y1="247" x2="480" y2="315" stroke="#7ee787" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="490" y="265" width="70" height="22" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="525" y="280" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="700">MPLS OK</text>

  <!-- 3. Decision 2: Verify Proxy-ID Phase 2 -->
  <g transform="translate(480, 360)" filter="url(#shadow)">
    <polygon points="0,-42 75,0 0,42 -75,0" fill="url(#decisionGrad)" stroke="#f2cc60" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Check Proxy-ID</text>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Phase 2 SA</text>
  </g>

  <!-- Branch 2: Proxy-ID Empty (Left down to col 2) -->
  <path d="M 405 360 L 340 360 L 340 600" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="350" y="440" width="80" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="390" y="455" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="700">Empty / Down</text>

  <!-- Branch 2: Proxy-ID Correct (Down to Diamond 3) -->
  <line x1="480" y1="402" x2="480" y2="470" stroke="#7ee787" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="490" y="420" width="60" height="22" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="520" y="435" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="700">Correct</text>

  <!-- 4. Decision 3: Verify Remote Gateway IP (NetBox) -->
  <g transform="translate(480, 515)" filter="url(#shadow)">
    <polygon points="0,-42 80,0 0,42 -80,0" fill="url(#decisionGrad)" stroke="#f2cc60" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Check Remote IP</text>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">vs NetBox SSoT</text>
  </g>

  <!-- Branch 3: IP Mismatch / Drift (Right to col 4) -->
  <path d="M 560 515 L 820 515 L 820 600" fill="none" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="640" y="500" width="130" height="22" rx="4" fill="#161b22" stroke="#8957e5" stroke-width="1"/>
  <text x="705" y="515" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="700">Drift vs NetBox SSoT</text>

  <!-- Branch 3: IP Match (Down to Diamond 4) -->
  <line x1="480" y1="557" x2="480" y2="615" stroke="#7ee787" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="490" y="570" width="60" height="22" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="520" y="585" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="700">Matches</text>

  <!-- 5. Decision 4: Check IPsec Traffic (Zombie Detection) -->
  <g transform="translate(480, 660)" filter="url(#shadow)">
    <polygon points="0,-42 80,0 0,42 -80,0" fill="url(#decisionGrad)" stroke="#f2cc60" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Check IPsec Bytes</text>
    <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">(Traffic Telemetry)</text>
  </g>

  <line x1="480" y1="702" x2="570" y2="702" stroke="#8b949e" stroke-width="2"/>
  <line x1="570" y1="702" x2="570" y2="645" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="495" y="705" width="120" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="555" y="720" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="700">0 Ingress/Egress Bytes</text>

  <!-- ================= 4 ROOT CAUSE BOXES ================= -->
  <!-- Col 1: Physical Failure -->
  <g transform="translate(50, 605)">
    <rect width="180" height="40" rx="6" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="700">Physical Carrier Fault</text>
  </g>

  <!-- Col 2: Phase 2 SA Failure -->
  <g transform="translate(250, 605)">
    <rect width="180" height="40" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">Logical: Phase 2 SA Down</text>
  </g>

  <!-- Col 3: Zombie Tunnel -->
  <g transform="translate(480, 605)">
    <rect width="180" height="40" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#f2cc60" font-size="11" font-weight="700">Logical: Zombie Tunnel</text>
  </g>

  <!-- Col 4: Config Drift -->
  <g transform="translate(730, 605)">
    <rect width="180" height="40" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
    <text x="90" y="25" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="700">Logical: Config Drift</text>
  </g>

  <!-- Lines from Root Cause to Action -->
  <line x1="140" y1="645" x2="140" y2="675" stroke="#da3633" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="645" x2="420" y2="675" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="605" x2="510" y2="675" stroke="#f2cc60" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="820" y1="645" x2="820" y2="675" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= 3 ACTION BOXES ================= -->
  <!-- Action 1: ISP Alert -->
  <g transform="translate(50, 680)">
    <rect width="180" height="45" rx="8" fill="url(#actionRed)" stroke="#f85149" stroke-width="1.5"/>
    <text x="90" y="27" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Action: Dispatch ISP Alert</text>
  </g>

  <!-- Action 2: Restart IPsec SA -->
  <g transform="translate(370, 680)">
    <rect width="220" height="45" rx="8" fill="url(#actionBlue)" stroke="#388bfd" stroke-width="1.5"/>
    <text x="110" y="27" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Action: Restart IPsec Tunnel SA</text>
  </g>

  <!-- Action 3: Reconcile SSoT via Python -->
  <g transform="translate(710, 680)">
    <rect width="220" height="45" rx="8" fill="url(#actionBlue)" stroke="#8957e5" stroke-width="1.5"/>
    <text x="110" y="27" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Action: Patch IP via Python/API</text>
  </g>

  <!-- Lines from Actions to MongoDB -->
  <path d="M 140 725 L 140 780 L 410 780 L 410 820" fill="none" stroke="#238636" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="725" x2="480" y2="820" stroke="#238636" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 820 725 L 820 780 L 550 780 L 550 820" fill="none" stroke="#238636" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= FINAL NODE: MONGODB ================= -->
  <g transform="translate(380, 825)" filter="url(#shadow)">
    <!-- Cylinder Representation -->
    <path d="M 0 15 A 100 15 0 0 0 200 15 L 200 45 A 100 15 0 0 1 0 45 Z" fill="url(#dbGrad)" stroke="#3fb950" stroke-width="1.5"/>
    <ellipse cx="100" cy="15" rx="100" ry="15" fill="#2ea043" stroke="#3fb950" stroke-width="1.5"/>
    <text x="100" y="38" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🗄️ Save Audit Event to MongoDB</text>
  </g>
</svg>
