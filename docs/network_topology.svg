<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#093c85" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="spokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#104e1e" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="oobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6e1010" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mplsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#461f8a" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="40" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="700">NetDevOps Laboratory Testbed: Segregated Architecture</text>
  <text x="550" y="65" text-anchor="middle" fill="#8b949e" font-size="13">Strict Separation of Data Plane (Underlay/Overlay) and Out-of-Band (OOB) Automation Network</text>

  <!-- ================= HUB SITE ================= -->
  <rect x="40" y="100" width="300" height="240" rx="12" fill="url(#hubGrad)" stroke="#388bfd" stroke-width="1.5"/>
  <text x="60" y="130" fill="#58a6ff" font-size="16" font-weight="700">🏢 HUB Site (Datacenter)</text>
  <text x="60" y="150" fill="#8b949e" font-size="12">Core LAN Subnet: 10.10.0.0/16</text>
  
  <!-- FortiGate HUB Box -->
  <rect x="60" y="170" width="260" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="190" y="198" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">Fortinet FortiGate HUB</text>
  <text x="190" y="222" text-anchor="middle" fill="#8b949e" font-size="11">WAN1: 172.16.10.1 | Mgmt: 192.168.100.10</text>
  
  <!-- Core Host -->
  <rect x="60" y="255" width="260" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="190" y="280" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="500">Core Services &amp; IPAM Endpoint</text>
  <text x="190" y="300" text-anchor="middle" fill="#7ee787" font-size="11">IP: 10.10.100.5</text>

  <!-- ================= CARRIER / UNDERLAY MPLS ================= -->
  <rect x="400" y="100" width="300" height="150" rx="12" fill="url(#mplsGrad)" stroke="#a371f7" stroke-width="1.5"/>
  <text x="550" y="130" text-anchor="middle" fill="#d2a8ff" font-size="16" font-weight="700">🌐 Underlay Carrier Network</text>
  <text x="550" y="150" text-anchor="middle" fill="#8b949e" font-size="12">MPLS Core Backbone | BGP AS 65000</text>
  <rect x="420" y="165" width="260" height="65" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="1"/>
  <text x="550" y="192" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="600">MPLS Transit Edge (PE Routers)</text>
  <text x="550" y="214" text-anchor="middle" fill="#d2a8ff" font-size="11">Transit Link: 172.16.10.0/30 &amp; 172.16.20.0/30</text>

  <!-- ================= SPOKE SITE ================= -->
  <rect x="760" y="100" width="300" height="240" rx="12" fill="url(#spokeGrad)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="780" y="130" fill="#7ee787" font-size="16" font-weight="700">🏬 Branch SPOKE Site</text>
  <text x="780" y="150" fill="#8b949e" font-size="12">Branch LAN Subnet: 10.20.0.0/16</text>
  
  <!-- FortiGate Spoke Box -->
  <rect x="780" y="170" width="260" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="910" y="198" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">Fortinet FortiGate SPOKE</text>
  <text x="910" y="222" text-anchor="middle" fill="#8b949e" font-size="11">WAN1: 172.16.20.2 | Mgmt: 192.168.100.20</text>
  
  <!-- Branch Client -->
  <rect x="780" y="255" width="260" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="910" y="280" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="500">Branch Workstation / Synthetic Client</text>
  <text x="910" y="300" text-anchor="middle" fill="#7ee787" font-size="11">IP: 10.20.100.50 (Chaos Test Target)</text>

  <!-- Data Plane Lines -->
  <!-- Underlay link HUB -> MPLS -->
  <line x1="320" y1="205" x2="420" y2="205" stroke="#a371f7" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Underlay link MPLS -> SPOKE -->
  <line x1="680" y1="205" x2="780" y2="205" stroke="#a371f7" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Overlay IPsec Tunnel Line (Arc) -->
  <path d="M 320 185 Q 550 50 780 185" fill="none" stroke="#58a6ff" stroke-width="4" filter="url(#glow)"/>
  <rect x="460" y="70" width="180" height="24" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="550" y="86" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">🔒 Overlay IPsec Tunnel (AES-256)</text>

  <!-- ================= OUT-OF-BAND (OOB) MANAGEMENT ================= -->
  <rect x="40" y="380" width="1020" height="260" rx="14" fill="url(#oobGrad)" stroke="#f85149" stroke-width="2"/>
  <text x="70" y="415" fill="#ff7b72" font-size="18" font-weight="700">🛡️ Out-of-Band (OOB) Management &amp; Autonomic Control Plane</text>
  <text x="70" y="435" fill="#8b949e" font-size="12">Segregated Management VLAN 999 | Subnet: 192.168.100.0/24 (Zero-Data-Plane Coupling)</text>

  <!-- OOB Components -->
  <!-- 1. PRTG -->
  <g transform="translate(70, 460)">
    <rect width="170" height="150" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" fill="#7ee787" font-size="14" font-weight="700">PRTG Monitor</text>
    <text x="85" y="55" text-anchor="middle" fill="#8b949e" font-size="11">SNMP / ICMP Poller</text>
    <text x="85" y="75" text-anchor="middle" fill="#8b949e" font-size="11">State Webhook Trigger</text>
    <rect x="15" y="100" width="140" height="30" rx="4" fill="#238636" fill-opacity="0.3"/>
    <text x="85" y="120" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">192.168.100.50</text>
  </g>

  <!-- 2. n8n -->
  <g transform="translate(270, 460)">
    <rect width="170" height="150" rx="8" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" fill="#ff7b72" font-size="14" font-weight="700">n8n State Machine</text>
    <text x="85" y="55" text-anchor="middle" fill="#8b949e" font-size="11">Event Orchestrator</text>
    <text x="85" y="75" text-anchor="middle" fill="#8b949e" font-size="11">Differential Analysis</text>
    <rect x="15" y="100" width="140" height="30" rx="4" fill="#da3633" fill-opacity="0.3"/>
    <text x="85" y="120" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="600">192.168.100.60:5678</text>
  </g>

  <!-- 3. NetBox -->
  <g transform="translate(470, 460)">
    <rect width="170" height="150" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">NetBox (SSoT)</text>
    <text x="85" y="55" text-anchor="middle" fill="#8b949e" font-size="11">IPAM &amp; DCIM Context</text>
    <text x="85" y="75" text-anchor="middle" fill="#8b949e" font-size="11">Canonical Intent State</text>
    <rect x="15" y="100" width="140" height="30" rx="4" fill="#1f6feb" fill-opacity="0.3"/>
    <text x="85" y="120" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">192.168.100.70:8000</text>
  </g>

  <!-- 4. Python Remediation Engine -->
  <g transform="translate(670, 460)">
    <rect width="170" height="150" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="85" y="30" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="700">Remediation Engine</text>
    <text x="85" y="55" text-anchor="middle" fill="#8b949e" font-size="11">REST API + Netmiko</text>
    <text x="85" y="75" text-anchor="middle" fill="#8b949e" font-size="11">PEP 668 Isolation</text>
    <rect x="15" y="100" width="140" height="30" rx="4" fill="#8957e5" fill-opacity="0.3"/>
    <text x="85" y="120" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="600">Python 3.11 Runtime</text>
  </g>

  <!-- 5. MongoDB & Metabase -->
  <g transform="translate(870, 460)">
    <rect width="160" height="150" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="80" y="30" text-anchor="middle" fill="#f2cc60" font-size="14" font-weight="700">Audit &amp; Telemetry</text>
    <text x="80" y="55" text-anchor="middle" fill="#8b949e" font-size="11">MongoDB Ledger</text>
    <text x="80" y="75" text-anchor="middle" fill="#8b949e" font-size="11">Metabase MTTR BI</text>
    <rect x="10" y="100" width="140" height="30" rx="4" fill="#9e6a03" fill-opacity="0.3"/>
    <text x="80" y="120" text-anchor="middle" fill="#f2cc60" font-size="11" font-weight="600">Ports: 27017 / 3000</text>
  </g>

  <!-- OOB Control Lines to FortiGates -->
  <path d="M 355 460 L 355 360 L 190 360 L 190 240" fill="none" stroke="#ff7b72" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 755 460 L 755 360 L 910 360 L 910 240" fill="none" stroke="#ff7b72" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="190" cy="240" r="4" fill="#ff7b72"/>
  <circle cx="910" cy="240" r="4" fill="#ff7b72"/>
</svg>
