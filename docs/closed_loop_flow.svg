<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="monGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#104e1e" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="anaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#093c85" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="planGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#461f8a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="execGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6e1010" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="knowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#704e05" stop-opacity="0.6"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="700">Autonomic Closed-Loop State Machine (MAPE-K Framework)</text>
  <text x="550" y="65" text-anchor="middle" fill="#8b949e" font-size="13">Continuous Self-Healing Workflow: Detection ➔ Differential Analysis ➔ SSoT Reconciliation ➔ Hybrid Remediation</text>

  <!-- STEP 1: MONITOR -->
  <g transform="translate(40, 100)">
    <rect width="180" height="200" rx="10" fill="url(#monGrad)" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="28" rx="4" fill="#238636"/>
    <text x="90" y="34" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1. MONITOR (PRTG)</text>
    <text x="90" y="70" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Metric Telemetry</text>
    <text x="90" y="95" text-anchor="middle" fill="#8b949e" font-size="11">• SNMP Ping Poller</text>
    <text x="90" y="115" text-anchor="middle" fill="#8b949e" font-size="11">• Tunnel SA State</text>
    <text x="90" y="135" text-anchor="middle" fill="#8b949e" font-size="11">• Jitter / Packet Loss</text>
    <rect x="15" y="155" width="150" height="30" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
    <text x="90" y="175" text-anchor="middle" fill="#7ee787" font-size="11" font-weight="600">⚡ HTTP Webhook Out</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="220" y1="200" x2="255" y2="200" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- STEP 2: ANALYZE -->
  <g transform="translate(260, 100)">
    <rect width="180" height="200" rx="10" fill="url(#anaGrad)" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="28" rx="4" fill="#1f6feb"/>
    <text x="90" y="34" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2. ANALYZE (n8n)</text>
    <text x="90" y="70" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Differential Triage</text>
    <text x="90" y="95" text-anchor="middle" fill="#8b949e" font-size="11">• ICMP Underlay Check</text>
    <text x="90" y="115" text-anchor="middle" fill="#8b949e" font-size="11">• ICMP Overlay Check</text>
    <text x="90" y="135" text-anchor="middle" fill="#8b949e" font-size="11">• Isolate Root Cause</text>
    <rect x="15" y="155" width="150" height="30" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
    <text x="90" y="175" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">🔍 Root Cause ID</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="440" y1="200" x2="475" y2="200" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- STEP 3: PLAN -->
  <g transform="translate(480, 100)">
    <rect width="180" height="200" rx="10" fill="url(#planGrad)" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="28" rx="4" fill="#8957e5"/>
    <text x="90" y="34" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3. PLAN (NetBox)</text>
    <text x="90" y="70" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">SSoT Validation</text>
    <text x="90" y="95" text-anchor="middle" fill="#8b949e" font-size="11">• Query IPAM Context</text>
    <text x="90" y="115" text-anchor="middle" fill="#8b949e" font-size="11">• Fetch Desired Config</text>
    <text x="90" y="135" text-anchor="middle" fill="#8b949e" font-size="11">• Prevent State Drift</text>
    <rect x="15" y="155" width="150" height="30" rx="4" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
    <text x="90" y="175" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="600">📋 Remediation Plan</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="660" y1="200" x2="695" y2="200" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- STEP 4: EXECUTE (HYBRID ENGINE) -->
  <g transform="translate(700, 80)">
    <rect width="360" height="240" rx="10" fill="url(#execGrad)" stroke="#f85149" stroke-width="2"/>
    <rect x="20" y="15" width="320" height="28" rx="4" fill="#da3633"/>
    <text x="180" y="34" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4. EXECUTE (Hybrid Remediation Engine)</text>
    
    <!-- Branch A: Primary REST API -->
    <rect x="20" y="55" width="320" height="70" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="35" y="80" fill="#7ee787" font-size="12" font-weight="700">Primary: FortiOS CMDB REST API</text>
    <text x="35" y="100" fill="#8b949e" font-size="11">PUT /api/v2/cmdb | Bearer Token Auth | HTTP 200 OK</text>
    <text x="35" y="115" fill="#58a6ff" font-size="10">Deterministic Execution (4-7s MTTR)</text>

    <!-- Branch B: Fallback Netmiko -->
    <rect x="20" y="140" width="320" height="70" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="35" y="165" fill="#f2cc60" font-size="12" font-weight="700">Fallback: Python 3.11 Netmiko (SSH / PEP 668)</text>
    <text x="35" y="185" fill="#8b949e" font-size="11">Triggered if API timeout / port blocked / 401 error</text>
    <text x="35" y="200" fill="#ff7b72" font-size="10">Out-of-band CLI session recovery</text>
  </g>

  <!-- Arrow down from Execute to Step 5 -->
  <path d="M 880 320 L 880 365 L 550 365 L 550 400" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- STEP 5: KNOWLEDGE & TELEMETRY -->
  <g transform="translate(180, 410)">
    <rect width="740" height="190" rx="12" fill="url(#knowGrad)" stroke="#d29922" stroke-width="2"/>
    <rect x="20" y="15" width="700" height="28" rx="4" fill="#9e6a03"/>
    <text x="370" y="34" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">5. KNOWLEDGE, OBSERVABILITY &amp; FORENSIC AUDIT TRAIL</text>

    <!-- Sub-box 1: Validation -->
    <rect x="30" y="60" width="210" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="135" y="85" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="600">✅ Post-Check Verify</text>
    <text x="135" y="110" text-anchor="middle" fill="#8b949e" font-size="11">Synthetic ICMP Ping</text>
    <text x="135" y="130" text-anchor="middle" fill="#8b949e" font-size="11">Tunnel SA Verified UP</text>
    <text x="135" y="150" text-anchor="middle" fill="#58a6ff" font-size="11">Service Restored</text>

    <!-- Sub-box 2: MongoDB -->
    <rect x="265" y="60" width="210" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="370" y="85" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">🗄️ MongoDB Audit</text>
    <text x="370" y="110" text-anchor="middle" fill="#8b949e" font-size="11">Immutable Timestamp</text>
    <text x="370" y="130" text-anchor="middle" fill="#8b949e" font-size="11">Pre/Post State JSON</text>
    <text x="370" y="150" text-anchor="middle" fill="#58a6ff" font-size="11">Strict Compliance Trail</text>

    <!-- Sub-box 3: Metabase & Telegram -->
    <rect x="500" y="60" width="210" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="605" y="85" text-anchor="middle" fill="#f2cc60" font-size="13" font-weight="600">📊 BI &amp; Alerting</text>
    <text x="605" y="110" text-anchor="middle" fill="#8b949e" font-size="11">Metabase Real-Time MTTR</text>
    <text x="605" y="130" text-anchor="middle" fill="#8b949e" font-size="11">Telegram SLA Dispatch</text>
    <text x="605" y="150" text-anchor="middle" fill="#7ee787" font-size="11">Zero Operational Toil</text>
  </g>

  <!-- Closed-loop feedback arrow from Knowledge back to Monitor -->
  <path d="M 180 500 L 90 500 L 90 310" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <rect x="40" y="375" width="100" height="20" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="90" y="389" text-anchor="middle" fill="#3fb950" font-size="9" font-weight="700">CLOSED LOOP</text>
</svg>
