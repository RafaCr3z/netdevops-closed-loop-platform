name: NetDevOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Run Black Code Formatter Check
        run: |
          black --check scripts/

      - name: Run Flake8 Static Analysis
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate JSON Workflows
        run: |
          python -m json.tool n8n/closed_loop_orchestration.json > /dev/null
